<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>trungit.dev</title>
<!-- Inline SVG favicon: no extra file, no extra request, and it stops the browser
     from firing a doomed request for /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23101012'/%3E%3Cpath%20d='M12.5%209.5L23%2016L12.5%2022.5Z'%20fill='%23fff'/%3E%3C/svg%3E">
<!-- Warm up DNS + TCP + TLS to the Steam CDN while the HTML is still parsing,
     in parallel with the script picking a URL, so the connection is ready by then.
     dns-prefetch is the fallback for browsers that ignore preconnect. -->
<link rel="preconnect" href="https://shared.fastly.steamstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://shared.fastly.steamstatic.com">
<style>
  :root { --fade: 600ms; }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  body {
    color: #fff;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #v {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: cover;
    opacity: 0;
    transition: opacity var(--fade) ease;
  }
  #v.ready { opacity: 1; }
  #v.contain { object-fit: contain; }

  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px 14px;
    padding:
      10px
      calc(14px + env(safe-area-inset-right))
      calc(12px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    color: rgba(255, 255, 255, .72);
    text-shadow: 0 1px 4px rgba(0, 0, 0, .9);
    pointer-events: none;
    user-select: none;
    opacity: 1;
    transition: opacity 800ms ease;
  }
  #hint.gone { opacity: 0; }
  #hint span { white-space: nowrap; }
  kbd {
    font: inherit;
    font-weight: 600;
    color: #fff;
  }

  #panel {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  #panel.on { display: grid; }
  #panel .card {
    max-width: 34rem;
    padding: 22px 24px;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 12px;
    background: rgba(20, 20, 22, .92);
  }
  #panel h1 {
    margin: 0 0 10px;
    font-size: 15px;
    letter-spacing: .01em;
  }
  #panel p {
    margin: 0 0 8px;
    color: rgba(255, 255, 255, .74);
  }
  #panel p:last-child { margin-bottom: 0; }
  code {
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, .1);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .92em;
  }

  :focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<video id="v" autoplay muted playsinline loop preload="auto"
       disablepictureinpicture disableremoteplayback aria-label="Video nền"></video>

<div id="hint">
  <span><kbd>R</kbd> — video khác</span>
  <span><kbd>F</kbd> — toàn màn hình</span>
  <span><kbd>C</kbd> — cover / contain</span>
</div>

<div id="panel" role="alert" aria-live="polite">
  <div class="card">
    <h1 id="panel-title"></h1>
    <div id="panel-body"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------
   * The playlist: absolute .mp4 URLs served by the Steam CDN, shaped
   *   https://shared.fastly.steamstatic.com/community_assets/images/items/<id>/<hash>.mp4
   * To add a clip, append one more line to this array. Nothing else
   * in the page needs to change.
   * ------------------------------------------------------------- */
  var STEAM_CLIPS = [
    'https://shared.fastly.steamstatic.com/community_assets/images/items/4761370/6b60e972f5148b6ff91df382568789d8d3fb736e.mp4',
    'https://shared.fastly.steamstatic.com/community_assets/images/items/4761370/3f85d6ce4b8cc9263fc2b0e3387ef46689016c1a.mp4',
    'https://shared.fastly.steamstatic.com/community_assets/images/items/4374420/fd1592d79e009adf8a5593a31e77b1559ae5689a.mp4'
    // <-- add new links here
  ];

  var KEY = 'mediabag.v1';
  var MAX_RETRIES = 3;
  var READY_TIMEOUT = 6000;
  var HINT_AFTER = 4000;

  var video = document.getElementById('v');
  var hint = document.getElementById('hint');
  var panel = document.getElementById('panel');

  /* ---------- Fingerprint: just enough to notice STEAM_CLIPS changed ---------- */

  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  var FP = STEAM_CLIPS.length + ':' + hash(STEAM_CLIPS.join('|'));

  /* ---------- Storage: every access can throw ---------- */

  var storageOK = true;

  function loadState() {
    try {
      var raw = window.localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      storageOK = false;   // private mode / storage blocked -> fall back to plain random
      return null;
    }
  }

  function saveState() {
    if (!storageOK) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOK = false;
    }
  }

  function isValid(s) {
    if (!s || typeof s !== 'object') return false;
    if (s.f !== FP) return false;
    if (!Array.isArray(s.bag)) return false;
    var seen = Object.create(null);
    for (var i = 0; i < s.bag.length; i++) {
      var n = s.bag[i];
      if (!Number.isInteger(n) || n < 0 || n >= STEAM_CLIPS.length || seen[n]) return false;
      seen[n] = true;
    }
    return true;
  }

  /* ---------- Shuffle bag ---------- */

  function shuffled() {
    var a = [];
    for (var i = 0; i < STEAM_CLIPS.length; i++) a.push(i);
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  var state = loadState();
  if (!isValid(state)) {
    state = { f: FP, bag: shuffled(), last: -1 };
  }

  function drawIndex() {
    if (!STEAM_CLIPS.length) return -1;

    if (!state.bag.length) {
      state.bag = shuffled();
      // Next draw would repeat the previous clip -> swap it away so two
      // consecutive page loads never show the same video.
      var n = state.bag.length;
      if (n > 1 && state.bag[n - 1] === state.last) {
        var t = state.bag[n - 1];
        state.bag[n - 1] = state.bag[0];
        state.bag[0] = t;
      }
    }

    var idx = state.bag.pop();
    state.last = idx;
    saveState();
    return idx;
  }

  /* ---------- Playback ---------- */

  var retries = 0;
  var timer = null;
  var stopped = false;

  function clearTimer() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
  }

  function showPanel(title, body) {
    stopped = true;
    clearTimer();
    try { video.pause(); } catch (e) {}
    video.classList.remove('ready');
    document.getElementById('panel-title').textContent = title;
    document.getElementById('panel-body').innerHTML = body;
    panel.classList.add('on');
    hint.classList.add('gone');
  }

  function giveUp() {
    showPanel(
      'Không tải được video',
      '<p>Đã thử ' + (MAX_RETRIES + 1) + ' link và không link nào chạy được.</p>' +
      '<p>Mở <code>index.html</code>, kiểm tra <code>const STEAM_CLIPS</code>: URL phải tuyệt đối, ' +
      'đuôi <code>.mp4</code>, và máy phải vào được CDN.</p>' +
      '<p>Nhấn <kbd>R</kbd> để thử lại.</p>'
    );
  }

  function fail() {
    if (stopped) return;
    clearTimer();
    if (retries < MAX_RETRIES) {
      retries++;
      start();
    } else {
      giveUp();
    }
  }

  function start() {
    var idx = drawIndex();
    if (idx < 0) {
      showPanel(
        'Danh sách trống',
        '<p>Mở <code>index.html</code> và thêm URL <code>.mp4</code> vào <code>const STEAM_CLIPS</code>.</p>'
      );
      return;
    }
    clearTimer();
    timer = setTimeout(fail, READY_TIMEOUT);
    video.src = STEAM_CLIPS[idx];
    ensurePlaying();
  }

  // Never call play() on a hidden tab: it gets rejected and the rejection also clears the
  // element's autoplay flag, leaving the clip frozen on frame one even after the tab is
  // fronted. While hidden, leave it to the autoplay attribute and pick it up on wake.
  function ensurePlaying() {
    if (stopped || document.hidden || !video.paused) return;
    var p = video.play();
    if (p && typeof p.catch === 'function') p.catch(function () {});
  }

  video.addEventListener('loadeddata', function () {
    if (stopped) return;
    clearTimer();
    video.classList.add('ready');
  });

  video.addEventListener('canplay', ensurePlaying);
  video.addEventListener('error', fail);
  document.addEventListener('visibilitychange', ensurePlaying);

  /* ---------- Controls ---------- */

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();

    if (k === 'r') {
      e.preventDefault();
      location.reload();
    } else if (k === 'f') {
      e.preventDefault();
      toggleFullscreen();
    } else if (k === 'c') {
      e.preventDefault();
      video.classList.toggle('contain');
    }
  });

  function toggleFullscreen() {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) {
          var r = exit.call(document);
          if (r && typeof r.catch === 'function') r.catch(function () {});
        }
      } else {
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          var r2 = req.call(el);
          if (r2 && typeof r2.catch === 'function') r2.catch(function () {});
        }
      }
    } catch (e) {}
  }

  /* ---------- Boot ---------- */

  video.muted = true;   // required, otherwise the browser blocks autoplay
  setTimeout(function () { hint.classList.add('gone'); }, HINT_AFTER);
  start();
})();
</script>

</body>
</html>
